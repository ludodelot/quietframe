<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640" role="img" aria-labelledby="t d">
<title id="t">How quietframe works: read, measure, strength, filter, render</title>
<desc id="d">Five-step flow: read the Log profile from the .CPF sidecar, measure noise on five frames, map the noise to an hqdn3d strength clamped to 4.0, filter before the LUT, render to a new file. Without numpy an ISO table is used instead.</desc>
<style>
:root{--bg:#0F0B1A;--panel:#17122A;--line:#3A3258;--fg:#FFFFFF;--dim:#A39EBB;--accent:#B880F2;--ok:#7BE0A4;--warn:#F2C46B;--grain:#8A84A0}
@media (prefers-color-scheme: light){:root{--bg:#FBF9FF;--panel:#F1ECFB;--line:#CFC5EA;--fg:#15111F;--dim:#5E5878;--accent:#7A3FCB;--ok:#1E8A55;--warn:#A56A00;--grain:#6F6885}}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--fg)}
.dim{fill:var(--dim)}.acc{fill:var(--accent)}.ok{fill:var(--ok)}.warn{fill:var(--warn)}
.b{font-weight:700}
.panel{fill:var(--panel);stroke:var(--line)}
.hot{fill:var(--panel);stroke:var(--accent);stroke-width:1.6}
.flow{stroke:var(--accent);stroke-width:2;fill:none;stroke-dasharray:6 8;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.fade{animation:fade 7s ease-in-out infinite}
@keyframes fade{0%,8%{opacity:.75}38%{opacity:.1}52%,92%{opacity:0}100%{opacity:.75}}
.sweep{animation:sweep 7s ease-in-out infinite}
@keyframes sweep{0%,6%{transform:translateX(0)}50%,100%{transform:translateX(var(--w))}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.fade{opacity:0}}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--accent)"/></marker>
<pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="1" fill="var(--grain)" opacity=".16"/></pattern>
</defs>
<rect width="1600" height="640" rx="14" fill="var(--bg)"/>
<rect width="1600" height="640" rx="14" fill="url(#dots)"/>
<text x="48" y="58" font-size="13" text-anchor="start" class="acc" >HOW IT WORKS</text><text x="48" y="98" font-size="32" text-anchor="start" class="b" >Measure the clip, then choose the strength</text><text x="48" y="126" font-size="14" text-anchor="start" class="dim" >ISO alone predicts noise poorly, so the strength comes from the noise measured in each clip.</text><rect x="48" y="160" width="276" height="210" rx="8" class="panel"/><text x="310" y="230" font-size="52" text-anchor="end" class="dim" opacity=".18" font-weight="700">01</text><text x="66" y="196" font-size="19" text-anchor="start" class="b" >READ</text><rect x="66" y="250" width="240" height="30" rx="5" fill="var(--bg)" stroke="var(--line)"/><text x="78" y="270" font-size="13" text-anchor="start" class="acc" >clip + .CPF</text><text x="66" y="316" font-size="12.5" text-anchor="start" class="dim" >Log profile from the sidecar,</text><text x="66" y="336" font-size="12.5" text-anchor="start" class="dim" >never guessed</text><line class="flow" x1="327" y1="265" x2="352" y2="265" stroke="var(--accent)" stroke-width="2" marker-end="url(#ar)"/><rect x="355" y="160" width="276" height="210" rx="8" class="panel"/><text x="617" y="230" font-size="52" text-anchor="end" class="dim" opacity=".18" font-weight="700">02</text><text x="373" y="196" font-size="19" text-anchor="start" class="b" >MEASURE</text><rect x="373" y="250" width="240" height="30" rx="5" fill="var(--bg)" stroke="var(--line)"/><text x="385" y="270" font-size="13" text-anchor="start" class="acc" >5 full frames</text><text x="373" y="316" font-size="12.5" text-anchor="start" class="dim" >median of truncated-RMS</text><text x="373" y="336" font-size="12.5" text-anchor="start" class="dim" >Haar diagonal band → σ</text><line class="flow" x1="634" y1="265" x2="659" y2="265" stroke="var(--accent)" stroke-width="2" marker-end="url(#ar)"/><rect x="662" y="160" width="276" height="210" rx="8" class="hot"/><text x="924" y="230" font-size="52" text-anchor="end" class="dim" opacity=".18" font-weight="700">03</text><text x="680" y="196" font-size="19" text-anchor="start" class="b acc" >STRENGTH</text><rect x="680" y="250" width="240" height="30" rx="5" fill="var(--bg)" stroke="var(--line)"/><text x="692" y="270" font-size="13" text-anchor="start" class="acc" >σ → hqdn3d</text><text x="680" y="316" font-size="12.5" text-anchor="start" class="dim" >per-profile anchors,</text><text x="680" y="336" font-size="12.5" text-anchor="start" class="dim" >spatial clamped to 4.0</text><line class="flow" x1="941" y1="265" x2="966" y2="265" stroke="var(--accent)" stroke-width="2" marker-end="url(#ar)"/><rect x="969" y="160" width="276" height="210" rx="8" class="panel"/><text x="1231" y="230" font-size="52" text-anchor="end" class="dim" opacity=".18" font-weight="700">04</text><text x="987" y="196" font-size="19" text-anchor="start" class="b" >FILTER</text><rect x="987" y="250" width="240" height="30" rx="5" fill="var(--bg)" stroke="var(--line)"/><text x="999" y="270" font-size="13" text-anchor="start" class="acc" >before the LUT</text><text x="987" y="316" font-size="12.5" text-anchor="start" class="dim" >hqdn3d chain, optional</text><text x="987" y="336" font-size="12.5" text-anchor="start" class="dim" >--lut my.cube</text><line class="flow" x1="1248" y1="265" x2="1273" y2="265" stroke="var(--accent)" stroke-width="2" marker-end="url(#ar)"/><rect x="1276" y="160" width="276" height="210" rx="8" class="panel"/><text x="1538" y="230" font-size="52" text-anchor="end" class="dim" opacity=".18" font-weight="700">05</text><text x="1294" y="196" font-size="19" text-anchor="start" class="b" >RENDER</text><rect x="1294" y="250" width="240" height="30" rx="5" fill="var(--bg)" stroke="var(--line)"/><text x="1306" y="270" font-size="13" text-anchor="start" class="acc" >new file</text><text x="1294" y="316" font-size="12.5" text-anchor="start" class="dim" >never overwrites input;</text><text x="1294" y="336" font-size="12.5" text-anchor="start" class="dim" >--force to replace output</text><path d="M186 370 V422 H800 V376" fill="none" stroke="var(--warn)" stroke-width="1.6" stroke-dasharray="4 6" marker-end="url(#ar)"/><text x="200" y="444" font-size="13" text-anchor="start" class="warn" >no numpy? fall back to the ISO table  (--mode iso, ISO from exiftool, never guessed)</text><rect x="48" y="480" width="1504" height="112" rx="8" class="panel"/><text x="72" y="512" font-size="12" text-anchor="start" class="dim" >COMMANDS</text><text x="72" y="538" font-size="13" text-anchor="start" >python -m quietframe filter clip.mp4                 # measure noise, print the -vf chain</text><text x="72" y="558" font-size="13" text-anchor="start" >python -m quietframe filter clip.mp4 --lut my.cube   # denoise, then your LUT</text><text x="72" y="578" font-size="13" text-anchor="start" class="acc" >python -m quietframe run clip.mp4 -o clean.mov --preset strong</text>
<rect x=".5" y=".5" width="1599" height="639" rx="14" fill="none" stroke="var(--line)"/>
</svg>
