<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" role="img" aria-labelledby="t d">
<title id="t">Denoise after the LUT keeps more detail at the same noise</title>
<desc id="d">Three panels, one clip each (Canon Log 2 ISO 6400, Canon Log 2 ISO 51200, Canon Log 3 ISO 8299), plotting detail kept against noise left for hqdn3d before and after the LUT. At the same residual noise, denoising after the LUT keeps the same or more detail in all three, most clearly in Canon Log 3.</desc>
<style>
:root{--bg:#0F0B1A;--panel:#17122A;--line:#3A3258;--fg:#FFFFFF;--dim:#A39EBB;--accent:#B880F2;--ok:#7BE0A4;--warn:#F2C46B;--grain:#8A84A0}
@media (prefers-color-scheme: light){:root{--bg:#FBF9FF;--panel:#F1ECFB;--line:#CFC5EA;--fg:#15111F;--dim:#5E5878;--accent:#7A3FCB;--ok:#1E8A55;--warn:#A56A00;--grain:#6F6885}}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--fg)}
.dim{fill:var(--dim)}.acc{fill:var(--accent)}.ok{fill:var(--ok)}.warn{fill:var(--warn)}
.b{font-weight:700}
.panel{fill:var(--panel);stroke:var(--line)}
.hot{fill:var(--panel);stroke:var(--accent);stroke-width:1.6}
.flow{stroke:var(--accent);stroke-width:2;fill:none;stroke-dasharray:6 8;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.fade{animation:fade 7s ease-in-out infinite}
@keyframes fade{0%,8%{opacity:.75}38%{opacity:.1}52%,92%{opacity:0}100%{opacity:.75}}
.sweep{animation:sweep 7s ease-in-out infinite}
@keyframes sweep{0%,6%{transform:translateX(0)}50%,100%{transform:translateX(var(--w))}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.fade{opacity:0}}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--accent)"/></marker>
<pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="1" fill="var(--grain)" opacity=".16"/></pattern>
</defs>
<rect width="1600" height="560" rx="14" fill="var(--bg)"/>
<rect width="1600" height="560" rx="14" fill="url(#dots)"/>
<text x="48" y="58" font-size="13" text-anchor="start" class="acc" >WHERE IN THE CHAIN</text><text x="48" y="98" font-size="32" text-anchor="start" class="b" >Denoise after the LUT: more detail at the same noise</text><text x="48" y="126" font-size="14" text-anchor="start" class="dim" >Each line is a strength sweep (1.5, 2, 3, 4). Further right = less noise left. Higher = more detail kept.</text><text x="80" y="172" font-size="15" text-anchor="start" class="b" >Canon Log 2 · ISO 6400</text><line x1="80" y1="390" x2="520" y2="390" stroke="var(--line)" stroke-dasharray="3 6"/><text x="70" y="394.0" font-size="11" text-anchor="end" class="dim" >88%</text><line x1="80" y1="323" x2="520" y2="323" stroke="var(--line)" stroke-dasharray="3 6"/><text x="70" y="327.3333333333333" font-size="11" text-anchor="end" class="dim" >92%</text><line x1="80" y1="257" x2="520" y2="257" stroke="var(--line)" stroke-dasharray="3 6"/><text x="70" y="260.6666666666667" font-size="11" text-anchor="end" class="dim" >96%</text><line x1="80" y1="190" x2="520" y2="190" stroke="var(--line)" stroke-dasharray="3 6"/><text x="70" y="194.0" font-size="11" text-anchor="end" class="dim" >100%</text><text x="80.0" y="462" font-size="11" text-anchor="middle" class="dim" >100%</text><text x="205.71428571428572" y="462" font-size="11" text-anchor="middle" class="dim" >80%</text><text x="331.42857142857144" y="462" font-size="11" text-anchor="middle" class="dim" >60%</text><text x="457.1428571428571" y="462" font-size="11" text-anchor="middle" class="dim" >40%</text><text x="300.0" y="484" font-size="11" text-anchor="middle" class="dim" >noise left</text><polyline points="313,240 369,257 419,290 438,323" fill="none" stroke="var(--dim)" stroke-width="3" stroke-dasharray="6 5"/><circle cx="313" cy="240" r="4.5" fill="var(--bg)" stroke="var(--dim)" stroke-width="2.5"/><circle cx="369" cy="257" r="4.5" fill="var(--bg)" stroke="var(--dim)" stroke-width="2.5"/><circle cx="419" cy="290" r="4.5" fill="var(--bg)" str