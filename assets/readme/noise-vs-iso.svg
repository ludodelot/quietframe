<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" role="img" aria-labelledby="t d">
<title id="t">Noise versus ISO for Log footage: why quietframe measures each clip</title>
<desc id="d">Median Log-domain noise sigma by ISO bucket for Canon Log 2 and Canon Log 3 on 356 Canon EOS R6 V clips, with 10th to 90th percentile bars. Log 2 rises from about 0.0008 to 0.0014; Log 3 from 0.0008 to 0.0011; at base ISO clips range from 0.0005 to 0.0012.</desc>
<style>
:root{--bg:#0F0B1A;--panel:#17122A;--line:#3A3258;--fg:#FFFFFF;--dim:#A39EBB;--accent:#B880F2;--ok:#7BE0A4;--warn:#F2C46B;--grain:#8A84A0}
@media (prefers-color-scheme: light){:root{--bg:#FBF9FF;--panel:#F1ECFB;--line:#CFC5EA;--fg:#15111F;--dim:#5E5878;--accent:#7A3FCB;--ok:#1E8A55;--warn:#A56A00;--grain:#6F6885}}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--fg)}
.dim{fill:var(--dim)}.acc{fill:var(--accent)}.ok{fill:var(--ok)}.warn{fill:var(--warn)}
.b{font-weight:700}
.panel{fill:var(--panel);stroke:var(--line)}
.hot{fill:var(--panel);stroke:var(--accent);stroke-width:1.6}
.flow{stroke:var(--accent);stroke-width:2;fill:none;stroke-dasharray:6 8;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.fade{animation:fade 7s ease-in-out infinite}
@keyframes fade{0%,8%{opacity:.75}38%{opacity:.1}52%,92%{opacity:0}100%{opacity:.75}}
.sweep{animation:sweep 7s ease-in-out infinite}
@keyframes sweep{0%,6%{transform:translateX(0)}50%,100%{transform:translateX(var(--w))}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.fade{opacity:0}}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--accent)"/></marker>
<pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="1" fill="var(--grain)" opacity=".16"/></pattern>
</defs>
<rect width="1600" height="560" rx="14" fill="var(--bg)"/>
<rect width="1600" height="560" rx="14" fill="url(#dots)"/>
<text x="48" y="58" font-size="13" text-anchor="start" class="acc" >MEASURE, DON&#x27;T TRUST ISO</text><text x="48" y="98" font-size="32" text-anchor="start" class="b" >Noise rises with ISO, but varies per clip and per Log curve</text><text x="48" y="126" font-size="14" text-anchor="start" class="dim" >356 Canon EOS R6 V clips, ISO 800 to 51200, Log domain. Dots: median. Bars: 10th to 90th percentile.</text><line x1="130" y1="408" x2="990" y2="408" stroke="var(--line)" stroke-dasharray="3 6"/><text x="118" y="411.5" font-size="11" text-anchor="end" class="dim" >0.0005</text><line x1="130" y1="345" x2="990" y2="345" stroke="var(--line)" stroke-dasharray="3 6"/><text x="118" y="349.0" font-size="11" text-anchor="end" class="dim" >0.0010</text><line x1="130" y1="282" x2="990" y2="282" stroke="var(--line)" stroke-dasharray="3 6"/><text x="118" y="286.5" font-size="11" text-anchor="end" class="dim" >0.0015</text><line x1="130" y1="220" x2="990" y2="220" stroke="var(--line)" stroke-dasharray="3 6"/><text x="118" y="224.0" font-size="11" text-anchor="end" class="dim" >0.0020</text><text x="118" y="156" font-size="11" text-anchor="end" class="dim" >σ  (Log domain)</text><polyline points="121,375 211,369 408,341 551,326 981,292" fill="none" stroke="var(--accent)" stroke-width="3"/><line x1="121" y1="408" x2="121" y2="339" stroke="var(--accent)" stroke-width="2" opacity=".55"/><circle cx="121" cy="375" r="5" fill="var(--bg)" stroke="var(--accent)" stroke-width="2.5"/><line x1="211" y1="402" x2="211" y2="329" stroke="var(--accent)" stroke-width="2" opacity=".55"/><circle cx="211" cy="369" r="5" fill="var(--bg)" stroke="var(--accent)" stroke-width="2.5"/><line x1="408" y1="365" x2="408" y2="302" stroke="var(--accent)" stroke-width="2" opacity=".55"/><circle cx="408" cy="341" r="5" fill="var(--bg)" stroke="var(--accent)" stroke-width="2.5"/><line x1="551" y1="355" x2="551" y2="285" stroke="var(--accent)" stroke-width="2" opacity=".55"/><circle cx="551" cy="326" r="5" fill="var(--bg)" stroke="var(--accent)" stroke-width="2.5"/><line x1="981" y1="314" x2="981" y2="208" stroke="var(--accent)" stroke-width="2" opacity=".55"/><circle cx="981" cy="292" r="5" fill="var(--bg)" stroke="var(--accent)" stroke-width="2.5"/><polyline points="139,368 229,368 479,358 623,345 892,336" fill="none" stroke="var(--warn)" stroke-width="3"/><line x1="139" y1="391" x2="139" y2="320" stroke="var(--warn)" stroke-width="2" opacity=".55"/><circle cx="139" cy="368" r="5" fill="var(--bg)" stroke="var(--warn)" stroke-width="2.5"/><line x1="229" y1="390" x2="229" y2="329" stroke="var(--warn)" stroke-width="2" opacity=".55"/><circle cx="229" cy="368" r="5" fill="var(--bg)" stroke="var(--warn)" stroke-width="2.5"/><line x1="479" y1="388" x2="479" y2="328" stroke="var(--warn)" stroke-width="2" opacity=".55"/><circle cx="479" cy="358" r="5" fill="var(--bg)" stroke="var(--warn)" stroke-width="2.5"/><line x1="623" y1="361" x2="623" y2="325" stroke="var(--warn)" stroke-width="2" opacity=".55"/><circle cx="623" cy="345" r="5" fill="var(--bg)" stroke="var(--warn)" stroke-width="2.5"/><line x1="892" y1="351" x2="892" y2="331" stroke="var(--warn)" stroke-width="2" opacity=".55"/><circle cx="892" cy="336" r="5" fill="var(--bg)" stroke="var(--warn)" stroke-width="2.5"/><text x="130.0" y="496" font-size="12" text-anchor="middle" class="dim" >800</text><text x="273.33333333333337" y="496" font-size="12" text-anchor="middle" class="dim" >1600</text><text x="416.6666666666669" y="496" font-size="12" text-anchor="middle" class="dim" >3200</text><text x="559.9999999999999" y="496" font-size="12" text-anchor="middle" class="dim" >6400</text><text x="703.3333333333333" y="496" font-size="12" text-anchor="middle" class="dim" >12800</text><text x="846.6666666666666" y="496" font-size="12" text-anchor="middle" class="dim" >25600</text><text x="990.0" y="496" font-size="12" text-anchor="middle" class="dim" >51200</text><text x="560.0" y="516" font-size="12" text-anchor="middle" class="dim" >ISO</text><circle cx="200" cy="152" r="5" fill="var(--accent)"/><text x="212" y="156" font-size="12" text-anchor="start" class="dim" >Canon Log 2 (160 clips)</text><circle cx="400" cy="152" r="5" fill="var(--warn)"/><text x="412" y="156" font-size="12" text-anchor="start" class="dim" >Canon Log 3 (196 clips)</text><rect x="1060" y="170" width="492" height="66" rx="8" class="panel"/><text x="1080" y="212" font-size="28" text-anchor="start" class="b acc" >±30%</text><text x="1250" y="210" font-size="13" text-anchor="start" class="dim" >treat any estimate as this accurate</text><rect x="1060" y="250" width="492" height="66" rx="8" class="panel"/><text x="1080" y="292" font-size="28" text-anchor="start" class="b acc" >5 frames</text><text x="1250" y="290" font-size="13" text-anchor="start" class="dim" >median of full frames per clip</text><rect x="1060" y="330" width="492" height="66" rx="8" class="panel"/><text x="1080" y="372" font-size="28" text-anchor="start" class="b acc" >~20%</text><text x="1250" y="370" font-size="13" text-anchor="start" class="dim" >per-frame spread</text><rect x="1060" y="410" width="492" height="66" rx="8" class="panel"/><text x="1080" y="452" font-size="28" text-anchor="start" class="b acc" >~25%</text><text x="1250" y="450" font-size="13" text-anchor="start" class="dim" >per-region spread</text><text x="48" y="544" font-size="12" text-anchor="start" class="dim" >Estimator: truncated-RMS of the Haar diagonal band. Spatial strength clamped to 4.0: at 4.5, ISO 51200 kept only 92% detail.</text>
<rect x=".5" y=".5" width="1599" height="559" rx="14" fill="none" stroke="var(--line)"/>
</svg>
