<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" role="img" aria-labelledby="t d">
<title id="t">Why denoise before the LUT: 33% residual noise versus 50% after</title>
<desc id="d">Bar chart for ISO 6400 on a Canon EOS R6 V: LUT only keeps 100 percent noise, hqdn3d after the LUT leaves 50 percent noise and keeps 96 percent detail, hqdn3d before the LUT leaves 33 percent noise and keeps 93 percent detail.</desc>
<style>
:root{--bg:#0F0B1A;--panel:#17122A;--line:#3A3258;--fg:#FFFFFF;--dim:#A39EBB;--accent:#B880F2;--ok:#7BE0A4;--warn:#F2C46B;--grain:#8A84A0}
@media (prefers-color-scheme: light){:root{--bg:#FBF9FF;--panel:#F1ECFB;--line:#CFC5EA;--fg:#15111F;--dim:#5E5878;--accent:#7A3FCB;--ok:#1E8A55;--warn:#A56A00;--grain:#6F6885}}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--fg)}
.dim{fill:var(--dim)}.acc{fill:var(--accent)}.ok{fill:var(--ok)}.warn{fill:var(--warn)}
.b{font-weight:700}
.panel{fill:var(--panel);stroke:var(--line)}
.hot{fill:var(--panel);stroke:var(--accent);stroke-width:1.6}
.flow{stroke:var(--accent);stroke-width:2;fill:none;stroke-dasharray:6 8;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.fade{animation:fade 7s ease-in-out infinite}
@keyframes fade{0%,8%{opacity:.75}38%{opacity:.1}52%,92%{opacity:0}100%{opacity:.75}}
.sweep{animation:sweep 7s ease-in-out infinite}
@keyframes sweep{0%,6%{transform:translateX(0)}50%,100%{transform:translateX(var(--w))}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.fade{opacity:0}}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--accent)"/></marker>
<pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="1" fill="var(--grain)" opacity=".16"/></pattern>
</defs>
<rect width="1600" height="560" rx="14" fill="var(--bg)"/>
<rect width="1600" height="560" rx="14" fill="url(#dots)"/>
<text x="48" y="58" font-size="13" text-anchor="start" class="acc" >WHY THE ORDER MATTERS</text><text x="48" y="98" font-size="32" text-anchor="start" class="b" >Denoise in Log, before the LUT</text><text x="48" y="126" font-size="14" text-anchor="start" class="dim" >The display transform amplifies shadow noise. Remove it first, at the same cost in detail.</text><text x="560" y="168" font-size="12" text-anchor="start" class="dim" >RESIDUAL NOISE  (lower is better)</text><text x="1140" y="168" font-size="12" text-anchor="start" class="dim" >DETAIL KEPT  (higher is better)</text><rect x="48" y="196" width="1504" height="76" rx="8" class="panel"/><text x="72" y="230" font-size="18" text-anchor="start" class="b" >LUT only</text><text x="72" y="254" font-size="13" text-anchor="start" class="dim" >no denoise</text><rect x="560" y="222" width="420" height="24" rx="4" fill="var(--line)" opacity=".5"/><rect x="560" y="222" width="420" height="24" rx="4" fill="var(--dim)"/><text x="994" y="241" font-size="18" text-anchor="start" class="b" >100%</text><rect x="1140" y="222" width="252" height="24" rx="4" fill="var(--line)" opacity=".5"/><rect x="1140" y="222" width="252" height="24" rx="4" fill="var(--accent)" opacity="0.55"/><text x="1406.0" y="241" font-size="18" text-anchor="start" class="b" >100%</text><rect x="48" y="288" width="1504" height="76" rx="8" class="panel"/><text x="72" y="322" font-size="18" text-anchor="start" class="b" >hqdn3d AFTER the LUT</text><text x="72" y="346" font-size="13" text-anchor="start" class="dim" >denoise in Rec.709</text><rect x="560" y="314" width="420" height="24" rx="4" fill="var(--line)" opacity=".5"/><rect x="560" y="314" width="210" height="24" rx="4" fill="var(--dim)"/><text x="994" y="333" font-size="18" text-anchor="start" class="b" >50%</text><rect x="1140" y="314" width="252" height="24" rx="4" fill="var(--line)" opacity=".5"/><rect x="1140" y="314" width="242" height="24" rx="4" fill="var(--accent)" opacity="0.55"/><text x="1406.0" y="333" font-size="18" text-anchor="start" class="b" >96%</text><rect x="48" y="380" width="1504" height="76" rx="8" class="hot"/><text x="72" y="414" font-size="18" text-anchor="start" class="b acc" >hqdn3d BEFORE the LUT</text><text x="72" y="438" font-size="13" text-anchor="start" class="dim" >hqdn3d=3:3:6:6 in Log</text><rect x="560" y="406" width="420" height="24" rx="4" fill="var(--line)" opacity=".5"/><rect x="560" y="406" width="139" height="24" rx="4" fill="var(--ok)"/><text x="994" y="425" font-size="18" text-anchor="start" class="b ok" >33%</text><rect x="1140" y="406" width="252" height="24" rx="4" fill="var(--line)" opacity=".5"/><rect x="1140" y="406" width="234" height="24" rx="4" fill="var(--accent)" opacity="1"/><text x="1406.0" y="425" font-size="18" text-anchor="start" class="b" >93%</text><text x="48" y="500" font-size="13" text-anchor="start" class="dim" >Canon EOS R6 V · Canon Log 3 · 4K 10-bit 4:2:2 · ISO 6400 · flat-region noise estimate on one clip per ISO.</text><text x="48" y="526" font-size="14" text-anchor="start" class="acc" >Same detail, about a third of the noise left. That is the whole idea.</text>
<rect x=".5" y=".5" width="1599" height="559" rx="14" fill="none" stroke="var(--line)"/>
</svg>
