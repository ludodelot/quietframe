[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quietframe"
dynamic = ["version"]
description = "Noise-adaptive denoising for Log camera footage, applied before the Log to Rec.709 transform."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ludovic Delot" }]
keywords = ["denoise", "video", "ffmpeg", "log", "canon", "color-grading", "rec709"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
dependencies = []

[project.optional-dependencies]
measure = ["numpy>=1.22"]

[project.scripts]
quietframe = "quietframe.cli:main"

[project.urls]
Homepage = "https://github.com/ludodelot/quietframe"

[tool.setuptools]
packages = ["quietframe"]

[tool.setuptools.dynamic]
version = { attr = "quietframe.__version__" }
